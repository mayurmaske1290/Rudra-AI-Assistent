<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Books</title><link rel='stylesheet' href='css/style.css'></head><body>
<div class='layout'><aside class='sidebar'><h3>LMS Admin</h3><a href='dashboard.html'>Dashboard</a><a href='books.html'>Books</a><a href='students.html'>Students</a><a href='publishers.html'>Publishers</a><a href='borrow.html'>Borrow</a><a href='return.html'>Return</a></aside>
<main class='main'><div class='topbar'><h2>Books</h2><div><button id='darkModeToggle'>Dark</button><button id='logoutBtn'>Logout</button></div></div>
<div class='toolbar'><input id='search' placeholder='Search title/author/category'><button id='addBtn'>Add Book</button></div>
<div class='table-wrap'><table><thead><tr><th>Book ID</th><th>Title</th><th>Author</th><th>Category</th><th>Copies</th><th>QR</th></tr></thead><tbody id='tbody'></tbody></table></div></main></div>
<div class='modal' id='modal'><div class='modal-content'><h3>Add Book</h3><div class='form' style='margin:0;max-width:none'><input id='book_id' placeholder='Book ID'><input id='title' placeholder='Title'><input id='author' placeholder='Author'><input id='price' type='number' placeholder='Price'><input id='publisher' placeholder='Publisher'><input id='category' placeholder='Category'><input id='available_copies' type='number' placeholder='Available Copies'><input id='cover_image' placeholder='Cover image URL'><button id='saveBook'>Save</button></div></div></div>
<script src='js/script.js'></script><script>
const load=async()=>{const r=await authFetch('/books?search='+encodeURIComponent(search.value||''));const d=await r.json();tbody.innerHTML=d.data.map(b=>`<tr><td>${b.book_id}</td><td>${b.title}</td><td>${b.author}</td><td>${b.category}</td><td>${b.available_copies}</td><td><img src='${b.qr_code}' width='45'></td></tr>`).join('')};
addBtn.onclick=()=>modal.classList.add('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};search.oninput=load;
saveBook.onclick=async()=>{const payload={book_id:book_id.value,title:title.value,author:author.value,price:Number(price.value),publisher:publisher.value,category:category.value,available_copies:Number(available_copies.value),cover_image:cover_image.value};const r=await authFetch('/books',{method:'POST',body:JSON.stringify(payload)});if(r.ok){toast('Book added');modal.classList.remove('show');load();}else toast('Failed');};load();
</script></body></html>
