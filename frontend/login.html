<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Login</title><link rel='stylesheet' href='css/style.css'></head>
<body><form class='form' id='loginForm'><h2>Admin Login</h2><input id='email' type='email' placeholder='Email' required><input id='password' type='password' placeholder='Password' required><button>Login</button><a href='register.html'>Create account</a></form><script src='js/script.js'></script><script>
loginForm.onsubmit=async(e)=>{e.preventDefault();const res=await fetch('http://localhost:5000/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const data=await res.json();if(!res.ok)return alert(data.message||'Login failed');localStorage.setItem('token',data.token);location.href='dashboard.html';};
</script></body></html>
