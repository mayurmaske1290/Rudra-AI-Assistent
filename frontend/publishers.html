<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Publishers</title><link rel='stylesheet' href='css/style.css'></head><body>
<div class='layout'><aside class='sidebar'><h3>LMS Admin</h3><a href='dashboard.html'>Dashboard</a><a href='books.html'>Books</a><a href='students.html'>Students</a><a href='publishers.html'>Publishers</a><a href='borrow.html'>Borrow</a><a href='return.html'>Return</a></aside>
<main class='main'><div class='topbar'><h2>Publishers</h2><div><button id='darkModeToggle'>Dark</button><button id='logoutBtn'>Logout</button></div></div>
<div class='form' style='margin:10px 0;max-width:none;grid-template-columns:repeat(4,1fr)'><input id='publisher_id' placeholder='Publisher ID'><input id='publisher_name' placeholder='Publisher Name'><input id='publisher_address' placeholder='Address'><button id='addPub'>Add</button></div>
<div class='table-wrap'><table><thead><tr><th>ID</th><th>Name</th><th>Address</th></tr></thead><tbody id='tbody'></tbody></table></div></main></div>
<script src='js/script.js'></script><script>
const load=async()=>{const r=await authFetch('/publishers');const d=await r.json();tbody.innerHTML=d.map(p=>`<tr><td>${p.publisher_id}</td><td>${p.publisher_name}</td><td>${p.publisher_address}</td></tr>`).join('')};
addPub.onclick=async()=>{const r=await authFetch('/publishers',{method:'POST',body:JSON.stringify({publisher_id:publisher_id.value,publisher_name:publisher_name.value,publisher_address:publisher_address.value})});toast(r.ok?'Publisher added':'Failed');load();};load();
</script></body></html>
