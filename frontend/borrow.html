<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Borrow</title><link rel='stylesheet' href='css/style.css'></head><body>
<div class='layout'><aside class='sidebar'><h3>LMS Admin</h3><a href='dashboard.html'>Dashboard</a><a href='books.html'>Books</a><a href='students.html'>Students</a><a href='publishers.html'>Publishers</a><a href='borrow.html'>Borrow</a><a href='return.html'>Return</a></aside>
<main class='main'><div class='topbar'><h2>Borrow Module</h2><div><button id='darkModeToggle'>Dark</button><button id='logoutBtn'>Logout</button></div></div>
<div class='form'><input id='student_id' placeholder='Student ID'><input id='book_id' placeholder='Book ID'><button id='borrowBtn'>Assign Book (30 days due)</button></div>
<div class='table-wrap'><h3>Overdue Books</h3><table><thead><tr><th>Student</th><th>Book</th><th>Due Date</th></tr></thead><tbody id='tbody'></tbody></table></div></main></div>
<script src='js/script.js'></script><script>
borrowBtn.onclick=async()=>{const r=await authFetch('/transactions/borrow',{method:'POST',body:JSON.stringify({student_id:student_id.value,book_id:book_id.value})});const d=await r.json();toast(r.ok?'Borrowed':'Error: '+(d.message||'fail'));load();};
const load=async()=>{const r=await authFetch('/transactions/overdue');const d=await r.json();tbody.innerHTML=d.map(x=>`<tr><td>${x.student_id}</td><td>${x.book_id}</td><td>${new Date(x.due_date).toLocaleDateString()}</td></tr>`).join('')};load();
</script></body></html>
